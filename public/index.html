<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orrerium — Brain</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span>O</span>RRERIUM</div>
    <nav class="panel-nav">
      <button class="nav-btn" data-panel="brain">Brain</button>
      <button class="nav-btn" data-panel="projects">Projects</button>
      <button class="nav-btn" data-panel="agents">Agents</button>
      <button class="nav-btn" data-panel="flows">Flows</button>
      <button class="nav-btn" data-panel="icons">Icons</button>
      <button class="nav-btn" data-panel="stats">Stats</button>
      <button class="nav-btn" data-panel="inbox">Inbox <span class="nav-count" id="inbox-count" hidden></span></button>
    </nav>
    <a id="demo-badge" class="demo-badge" href="#/agents" hidden
      title="Replaying sample sessions - run node hooks/install.js to watch your own agents">demo</a>
    <div id="status-dot" class="status-dot" title="connecting…"></div>
  </header>
  <main class="layout panel-section" id="panel-brain">
    <section id="graph-panel" class="graph-panel">
      <svg id="graph" role="img" aria-label="Knowledge graph of the Brain vault"></svg>
      <div class="graph-controls">
        <div class="layout-toggle" id="layout-toggle">
          <span class="seg-label">layout</span>
          <button class="seg-btn" data-layout="rings">Rings</button>
          <button class="seg-btn" data-layout="force">Force</button>
        </div>
        <div class="motion-toggle" id="motion-toggle">
          <span class="seg-label">motion</span>
          <button class="seg-btn" data-motion="auto" title="Follow the OS reduced-motion preference">Auto</button>
          <button class="seg-btn" data-motion="full" title="Always animate live agent traffic">On</button>
        </div>
        <div class="search-wrap">
          <input id="search" type="search" placeholder="Search notes…" autocomplete="off" spellcheck="false">
          <span id="search-count" class="search-count"></span>
        </div>
      </div>
      <div id="legend" class="legend"></div>
      <div id="edge-tooltip" class="edge-tooltip hidden"></div>
    </section>
    <aside id="note-panel" class="note-panel hidden" aria-label="Note preview"></aside>
  </main>
  <main class="panel-section board-section hidden" id="panel-projects">
    <div class="board-inner">
      <div class="board-head" id="projects-head"></div>
      <div class="proj-grid" id="projects-grid"></div>
    </div>
  </main>
  <main class="panel-section board-section hidden" id="panel-agents">
    <div class="board-inner">
      <div class="board-head" id="agents-head"></div>
      <div id="agents-cards"></div>
    </div>
  </main>
  <main class="panel-section board-section hidden" id="panel-flows">
    <div class="board-inner">
      <div class="board-head" id="flows-head"></div>
      <div class="flows-controls">
        <select id="flows-select"></select>
        <button id="flows-play" class="flow-play-btn" title="Replay">▶</button>
        <input id="flows-scrub" type="range" min="0" max="1000" value="1000">
      </div>
      <div class="flows-timeline-wrap"><svg id="flows-svg" role="img" aria-label="Session timeline"></svg></div>
      <div id="flows-detail"></div>
    </div>
  </main>
  <main class="panel-section board-section hidden" id="panel-icons">
    <div class="board-inner">
      <div class="board-head" id="icons-head"></div>
      <div id="icons-gallery" class="icons-gallery"></div>
      <div id="icons-agents" class="icons-agents"></div>
    </div>
  </main>
  <main class="panel-section board-section hidden" id="panel-stats">
    <div class="board-inner">
      <div class="board-head" id="stats-head"></div>
      <div class="stats-tiles" id="stats-tiles"></div>
      <div class="stats-chart" id="stats-days"></div>
      <div id="stats-tools"></div>
    </div>
  </main>
  <main class="panel-section board-section hidden" id="panel-inbox">
    <div class="board-inner">
      <div class="board-head" id="inbox-head"></div>
      <div id="inbox-entries"></div>
    </div>
  </main>
  <script src="/vendor/d3.v7.min.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
